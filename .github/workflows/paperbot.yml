name: BTC ETH Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run paper trading bot
        run: |
          cat > paperbot.py <<'PY'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone

          STATE_FILE = "paper_account.json"
          INITIAL_CASH = 10000.0
          FEE = 0.0005
          SLIPPAGE = 0.0005
          MAX_POSITION = 0.25
          MAX_TOTAL_POSITION = 0.50

          def now():
              return datetime.now(timezone.utc).isoformat()

          def get_klines(symbol):
              params = urllib.parse.urlencode({
                  "symbol": symbol,
                  "interval": "5m",
                  "limit": 200
              })
              url = "https://data-api.binance.vision/api/v3/klines?" + params
              req = urllib.request.Request(
                  url, headers={"User-Agent": "PaperTradingBot/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.loads(response.read().decode())
              return data

          def ema(values, period):
              alpha = 2 / (period + 1)
              result = values[0]
              for value in values[1:]:
                  result = alpha * value + (1 - alpha) * result
              return result

          def rsi(values, period=14):
              changes = [values[i] - values[i-1] for i in range(1, len(values))]
              gains = [max(x, 0) for x in changes[-period:]]
              losses = [max(-x, 0) for x in changes[-period:]]
              avg_gain = sum(gains) / period
              avg_loss = sum(losses) / period
              if avg_loss == 0:
                  return 100.0
              rs = avg_gain / avg_loss
              return 100 - 100 / (1 + rs)

          def load_state():
              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, "r") as f:
                      return json.load(f)
              return {
                  "cash": INITIAL_CASH,
                  "positions": {},
                  "last_candle": {},
                  "trades": [],
                  "created_at": now(),
                  "daily_start_equity": INITIAL_CASH,
                  "daily_date": datetime.now(timezone.utc).date().isoformat()
              }

          def save_state(state):
              with open(STATE_FILE, "w") as f:
                  json.dump(state, f, indent=2)

          def main():
              state = load_state()
              prices = {}
              signals = []

              for symbol in ["BTCUSDT", "ETHUSDT"]:
                  try:
                      candles = get_klines(symbol)
                      # 排除尚未收盘的最后一根K线
                      closed = candles[:-1]
                      closes = [float(x[4]) for x in closed]
                      candle_time = str(closed[-1][0])
                      price = closes[-1]
                      prices[symbol] = price

                      if len(closes) < 60:
                          continue

                      if state["last_candle"].get(symbol) == candle_time:
                          signals.append(f"{symbol}: 本根K线已处理")
                          continue

                      fast = ema(closes[-60:], 12)
                      slow = ema(closes[-60:], 48)
                      previous_fast = ema(closes[-61:-1], 12)
                      previous_slow = ema(closes[-61:-1], 48)
                      current_rsi = rsi(closes)

                      position = state["positions"].get(
                          symbol, {"qty": 0.0, "avg_price": 0.0}
                      )

                      equity = state["cash"]
                      for coin, pos in state["positions"].items():
                          equity += pos["qty"] * prices.get(coin, pos["avg_price"])

                      total_value = sum(
                          p["qty"] * prices.get(c, p["avg_price"])
                          for c, p in state["positions"].items()
                      )

                      buy_signal = (
                          previous_fast <= previous_slow
                          and fast > slow
                          and 45 <= current_rsi <= 65
                      )
                      sell_signal = (
                          previous_fast >= previous_slow
                          and fast < slow
                      ) or current_rsi >= 78

                      if sell_signal and position["qty"] > 0:
                          sell_price = price * (1 - SLIPPAGE)
                          gross = position["qty"] * sell_price
                          fee = gross * FEE
                          net = gross - fee
                          state["cash"] += net
                          state["trades"].append({
                              "time": now(), "symbol": symbol,
                              "side": "SELL", "price": price,
                              "qty": position["qty"], "fee": fee
                          })
                          state["positions"][symbol] = {
                              "qty": 0.0, "avg_price": 0.0
                          }
                          signals.append(f"{symbol}: 模拟卖出")
                      elif buy_signal and position["qty"] == 0:
                          remaining_room = max(
                              0, equity * MAX_TOTAL_POSITION - total_value
                          )
                          budget = min(
                              equity * MAX_POSITION,
                              remaining_room,
                              state["cash"] / (1 + FEE)
                          )
                          if budget > 10:
                              buy_price = price * (1 + SLIPPAGE)
                              fee = budget * FEE
                              qty = (budget - fee) / buy_price
                              state["cash"] -= budget
                              state["positions"][symbol] = {
                                  "qty": qty, "avg_price": buy_price
                              }
                              state["trades"].append({
                                  "time": now(), "symbol": symbol,
                                  "side": "BUY", "price": buy_price,
                                  "qty": qty, "fee": fee
                              })
                              signals.append(f"{symbol}: 模拟买入")
                          else:
                              signals.append(f"{symbol}: 资金不足")
                      else:
                          signals.append(
                              f"{symbol}: HOLD RSI={current_rsi:.2f}"
                          )

                      state["last_candle"][symbol] = candle_time

                  except Exception as e:
                      signals.append(f"{symbol}: 数据或计算错误: {e}")

              equity = state["cash"]
              for symbol, pos in state["positions"].items():
                  equity += pos["qty"] * prices.get(symbol, pos["avg_price"])

              state["updated_at"] = now()
              state["last_prices"] = prices
              state["last_signals"] = signals
              state["equity"] = round(equity, 4)
              state["total_return_pct"] = round(
                  (equity / INITIAL_CASH - 1) * 100, 4
              )
              save_state(state)

              print("=== BTC / ETH 模拟交易 ===")
              print("时间:", state["updated_at"])
              for item in signals:
                  print(item)
              print("现金:", round(state["cash"], 2))
              print("账户权益:", round(equity, 2))
              print("收益率:", state["total_return_pct"], "%")
              print("成交次数:", len(state["trades"]))
              print("注意：以上均为模拟交易，不代表真实收益。")

          if __name__ == "__main__":
              main()
          PY
          python paperbot.py

      - name: Save simulated account state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_account.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper trading account"
            git push
          fi