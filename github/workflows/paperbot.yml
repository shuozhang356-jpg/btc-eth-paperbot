name: BTC ETH Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-eth-paperbot
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run simulation
        shell: bash
        run: |
          cat > paperbot.py <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          STATE = "paper_account.json"
          INITIAL_CASH = 10000.0
          FEE = 0.0005
          SLIPPAGE = 0.0005
          MAX_COIN = 0.25
          MAX_TOTAL = 0.50
          DAILY_STOP = 0.01
          SYMBOLS = ["BTCUSDT", "ETHUSDT"]

          def now():
              return datetime.now(timezone.utc)

          def get_candles(symbol):
              params = urllib.parse.urlencode({
                  "symbol": symbol,
                  "interval": "5m",
                  "limit": 200
              })
              url = (
                  "https://data-api.binance.vision/api/v3/klines?"
                  + params
              )
              req = urllib.request.Request(
                  url, headers={"User-Agent": "PaperBot/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.loads(response.read().decode())
              if len(data) < 60:
                  raise RuntimeError("K线数据不足")
              # 不使用尚未收盘的K线
              return data[:-1]

          def ema(values, period):
              alpha = 2.0 / (period + 1)
              result = values[0]
              for value in values[1:]:
                  result = alpha * value + (1-alpha) * result
              return result

          def rsi(values, period=14):
              changes = [
                  values[i] - values[i-1]
                  for i in range(1, len(values))
              ][-period:]
              gains = sum(max(x, 0) for x in changes) / period
              losses = sum(max(-x, 0) for x in changes) / period
              if losses == 0:
                  return 100.0
              return 100 - 100 / (1 + gains / losses)

          def load_state():
              if os.path.exists(STATE):
                  with open(STATE, "r") as f:
                      s = json.load(f)
                  return s
              return {
                  "cash": INITIAL_CASH,
                  "positions": {
                      x: {"qty": 0.0, "avg_price": 0.0}
                      for x in SYMBOLS
                  },
                  "last_candle": {},
                  "trades": [],
                  "daily_date": now().date().isoformat(),
                  "daily_start_equity": INITIAL_CASH,
                  "created_at": now().isoformat()
              }

          def save_state(s):
              temp = STATE + ".tmp"
              with open(temp, "w") as f:
                  json.dump(s, f, indent=2)
              os.replace(temp, STATE)

          def main():
              s = load_state()
              prices = {}
              candles_by_symbol = {}

              # 先获取两个币种行情，再计算账户权益
              for symbol in SYMBOLS:
                  candles = get_candles(symbol)
                  candles_by_symbol[symbol] = candles
                  prices[symbol] = float(candles[-1][4])

              def equity_value():
                  total = s["cash"]
                  for symbol in SYMBOLS:
                      total += (
                          s["positions"][symbol]["qty"]
                          * prices[symbol]
                      )
                  return total

              today = now().date().isoformat()
              if s["daily_date"] != today:
                  s["daily_date"] = today
                  s["daily_start_equity"] = equity_value()

              start_equity = float(s["daily_start_equity"])
              current_equity = equity_value()
              daily_loss = (
                  (start_equity - current_equity) / start_equity
                  if start_equity > 0 else 0
              )
              pause_buys = daily_loss >= DAILY_STOP

              messages = []

              for symbol in SYMBOLS:
                  candles = candles_by_symbol[symbol]
                  closes = [float(x[4]) for x in candles]
                  candle_id = str(candles[-1][0])

                  if s["last_candle"].get(symbol) == candle_id:
                      messages.append(symbol + ": 本根K线已处理")
                      continue

                  fast_now = ema(closes, 12)
                  slow_now = ema(closes, 48)
                  fast_prev = ema(closes[:-1], 12)
                  slow_prev = ema(closes[:-1], 48)
                  current_rsi = rsi(closes)
                  price = prices[symbol]
                  pos = s["positions"][symbol]

                  buy_signal = (
                      fast_prev <= slow_prev
                      and fast_now > slow_now
                      and 45 <= current_rsi <= 65
                  )
                  sell_signal = (
                      fast_prev >= slow_prev
                      and fast_now < slow_now
                  ) or current_rsi >= 78

                  if sell_signal and pos["qty"] > 0:
                      sell_price = price * (1 - SLIPPAGE)
                      gross = pos["qty"] * sell_price
                      fee = gross * FEE
                      s["cash"] += gross - fee
                      s["trades"].append({
                          "time": now().isoformat(),
                          "symbol": symbol,
                          "side": "SELL",
                          "price": sell_price,
                          "qty": pos["qty"],
                          "fee": fee
                      })
                      pos["qty"] = 0.0
                      pos["avg_price"] = 0.0
                      messages.append(symbol + ": 模拟卖出")

                  elif buy_signal and pos["qty"] == 0:
                      if pause_buys:
                          messages.append(symbol + ": 达到每日亏损线，暂停买入")
                      else:
                          current_equity = equity_value()
                          total_position = sum(
                              s["positions"][x]["qty"] * prices[x]
                              for x in SYMBOLS
                          )
                          room = max(
                              0,
                              current_equity * MAX_TOTAL - total_position
                          )
                          budget = min(
                              current_equity * MAX_COIN,
                              room,
                              s["cash"] / (1 + FEE)
                          )
                          if budget > 10:
                              buy_price = price * (1 + SLIPPAGE)
                              fee = budget * FEE
                              qty = (budget - fee) / buy_price
                              s["cash"] -= budget
                              pos["qty"] = qty
                              pos["avg_price"] = buy_price
                              s["trades"].append({
                                  "time": now().isoformat(),
                                  "symbol": symbol,
                                  "side": "BUY",
                                  "price": buy_price,
                                  "qty": qty,
                                  "fee": fee
                              })
                              messages.append(symbol + ": 模拟买入")
                          else:
                              messages.append(symbol + ": 资金不足")
                  else:
                      messages.append(
                          f"{symbol}: HOLD RSI={current_rsi:.2f}"
                      )

                  s["last_candle"][symbol] = candle_id

              final_equity = equity_value()
              s["updated_at"] = now().isoformat()
              s["last_prices"] = prices
              s["last_signals"] = messages
              s["equity"] = round(final_equity, 4)
              s["return_pct"] = round(
                  (final_equity / INITIAL_CASH - 1) * 100, 4
              )
              save_state(s)

              print("=== 模拟交易结果 ===")
              for msg in messages:
                  print(msg)
              print("现金:", round(s["cash"], 2))
              print("权益:", round(final_equity, 2))
              print("累计收益率:", s["return_pct"], "%")
              print("成交次数:", len(s["trades"]))
              print("每日亏损暂停:", pause_buys)
              print("仅模拟交易，不会真实下单。")

          if __name__ == "__main__":
              main()
          PY

          python -m py_compile paperbot.py
          python paperbot.py

      - name: Save simulation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_account.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper trading state"
            git push
          fi